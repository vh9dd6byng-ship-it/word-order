<!DOCTYPE html>
<html lang="ko">
<head>

<title>단어 배열 연습</title>
<style>
:root{--bg:#f2f2f2;--card:#fff;--line:#d2d2d2;--text:#222;--sub:#777;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#c62828;--badbg:#fdecea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:820px;margin:0 auto;padding:0 14px 80px}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 0;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:12px}
.bar button{background:#fff;border:1px solid #bdbdbd;color:#555;border-radius:10px;padding:9px 16px;font-size:15px;font-weight:600}
.bar button:active{background:#e6e6e6}
.bar .t{margin-left:6px;font-size:15px;font-weight:700;color:#444;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22vh}
.home h1{grid-column:1/-1;margin:0 0 6px;text-align:center;font-size:24px;color:#444}
.big{background:#fff;border:1px solid #c8c8c8;border-radius:16px;padding:34px 10px;font-size:20px;font-weight:700;color:#444}
.big:active{background:#e6e6e6}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #cfcfcf;border-radius:12px;padding:15px 16px;font-size:17px;text-align:left;color:#333;width:100%}
.row:active{background:#e6e6e6}
.row .n{min-width:52px;font-weight:700;color:#666}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.num{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:#e4e4e4;color:#555;font-size:13px;font-weight:700;padding:0 6px}
.spk{font-size:13px;font-weight:700;color:#666;background:#efefef;border-radius:8px;padding:3px 9px}
.ko{font-size:15px;line-height:1.55;color:#555;margin:4px 0 12px}
.slots{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;background:#fafafa;border:1px solid #e3e3e3;min-height:60px}
.slot{min-width:58px;height:42px;border:1.5px dashed #bdbdbd;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.slot.filled{border:none;background:transparent;min-width:0}
.slot.empty-bad{border-color:var(--bad);background:var(--badbg)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding:10px;background:#ececec;border-radius:12px;min-height:56px}
.chip{display:inline-block;background:#fff;border:1px solid #b9b9b9;border-radius:10px;padding:0 12px;height:42px;line-height:40px;font-size:16px;white-space:nowrap;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.chip.lift{opacity:.25}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-60%);box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:.95}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:#1b5e20}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:#8e1b1b}
.card.locked .chip{cursor:default}
.act{display:flex;gap:8px;margin-top:12px}
.act button{background:#fff;border:1px solid #bdbdbd;color:#555;border-radius:10px;padding:9px 18px;font-size:15px;font-weight:600}
.act button:active{background:#e6e6e6}
.res{margin-top:12px;font-size:15px;line-height:1.5}
.res b.ok{color:var(--ok)}
.res b.bad{color:var(--bad)}
.res .ans{margin-top:4px;color:#333;background:#f4f4f4;border-radius:10px;padding:10px 12px}
</style>
</head>

<div id="app"></div>
<script>
//#PURE-START
const EXAMS = {
"모고25": [
["18","고객 후기",`
Dear Mr. Kelly, ## 친애하는 Kelly 씨께,
My name is Mark Smith, and I am the manager of Lomos Tours. ## 제 이름은 Mark Smith이며, 저는 Lomos Tours의 매니저입니다.
I express our sincere appreciation for your continued trust and loyalty. ## 저는 당신의 지속적인 신뢰와 충심에 우리의 진심 어린 감사를 표합니다.
Next year, as part of a new promotional campaign, Lomos Tours will be airing an advertisement. ## 내년에, 새로운 홍보 캠페인의 일환으로, Lomos Tours는 광고를 방영하려고 합니다.
We plan to include the experiences of some of our most valued clients. ## 우리는 우리의 가장 소중한 몇몇 고객님들의 경험을 담을 계획입니다.
Since you traveled with us last summer, I would like to kindly ask if you would be willing to share a few words about your experience. ## 당신은 지난여름에 우리와 함께 여행하셨기에, 저는 당신의 경험에 대해 몇 마디 말씀을 기꺼이 공유해 주실 수 있는지 정중히 부탁드리고 싶습니다.
Your feedback would be invaluable in helping us promote our services. ## 당신의 피드백은 우리가 서비스를 홍보하는 것을 도와주는 데 매우 소중할 것입니다.
A member of our team will be in touch with you shortly. ## 우리 팀의 직원 한 명이 곧 연락드릴 것입니다.
Thank you in advance for your contributions. ## 당신의 기여에 미리 감사드립니다.
Warm regards, ## 따뜻한 안부를 전하며,
`],
["19","자동차 착각",`
After finishing my shopping, I walked out of the grocery store and headed to the spot where I’d parked my car. ## 쇼핑을 마친 후에, 나는 식료품 가게를 걸어 나가 내가 차를 주차했던 장소로 향했다.
But it wasn’t there. ## 그러나 그것이 거기에 없었다.
I wasn’t the kind of person to forget where I’d parked. ## 나는 내가 주차했던 장소를 잊어버릴 그런 사람이 아니었다.
I knew I was in the right place — so where was my car? ## 나는 내가 정확한 장소에 있다는 것을 알았지만, 그렇다면 내 차는 어디에 있는 걸까?
I looked around, but nothing made sense. ## 나는 주위를 둘러보았지만, 도무지 아무것도 이해되지 않았다.
Not knowing what to do, I called my husband at home and said, “My car is missing! I can’t find my car.” ## 무엇을 해야 할지 몰라, 나는 집에 있는 남편에게 전화를 걸어 “내 차가 없어졌어요! 나는 차를 못 찾겠어요.”라고 말했다.
I heard him laughing on the other end of the line. ## 나는 그가 전화기의 반대편에서 웃는 것을 들었다.
“Your car is here outside the house! ## “당신의 차는 여기 집 밖에 있어요!
You took mine today, remember?” ## 당신은 오늘 내 차를 가져갔어요. 기억나죠?”
I turned around — and there it was. ## 나는 돌아보았고, 그것은 거기에 있었다.
I couldn’t help but laugh at myself. ## 나는 실소를 금할 수 없었다.
With a sigh of relief, I walked over to the car. ## 안도의 숨을 내쉬며, 나는 차로 걸어갔다.
Everything was fine after all. ## 결국 모든 것이 괜찮았다.
`],
["20","인간관계 유지",`
One of the most important aspects of sustaining long-term relationships is communication. ## 장기적인 관계를 유지하는 데 가장 중요한 측면 중 하나는 소통이다.
It’s easy to connect with someone and then let the relationship get stuck due to a lack of follow-up. ## 누군가와 친해지고 나서 추후 연락 부족으로 인해 그 관계가 정체되도록 내버려 두기 쉽다.
To keep the connection alive, make a conscious effort to stay in touch. ## 관계를 유지하기 위해, 연락하고 지내려는 의식적인 노력을 기울여라.
This doesn’t mean constantly reaching out with requests or updates but rather maintaining a friendly and consistent line of communication. ## 이는 요청이나 최근 소식을 가지고 끊임없이 연락을 취하는 것이 아니라 오히려 친근하고 일관된 소통의 끈을 유지하는 것을 의미한다.
A simple message to check in or share something of value can go a long way in reinforcing your relationship. ## 안부를 확인하거나 가치 있는 무언가를 공유하는 간단한 메시지가 여러분의 관계를 강화하는 데 도움이 될 수 있다.
For example, if you come across an article or resource that you think might interest a connection, share it with them, even if you haven’t spoken in a while. ## 예를 들어, 여러분이 자신과 관계가 있는 사람의 흥미를 끌 수 있다고 여기는 기사나 자료를 우연히 발견하면, 한동안 이야기하지 않았다고 할지라도 그들과 그것을 공유하라.
This shows that you’re thinking of them and are invested in maintaining the relationship. ## 이는 여러분이 그들을 생각하고 있으며 관계를 지속하는 데 노력을 쏟고 있다는 것을 보여 준다.
`],
["21","도시 공원 개발",`
Currently, urban regeneration projects in degraded areas have been promoted as improving the wellbeing of residents and solving environmental injustice problems. ## 현재, 낙후된 지역에서 도시 재생 프로젝트는 거주자들의 복지를 향상시키고 환경적 불평등 문제를 해결하는 것으로서 추진되어 왔다.
However, such environmental improvements in ethnic communities and/or low-income households can create an urban green space paradox. ## 하지만, 소수민족 공동체들 및/또는 저소득층 가구에서 그러한 환경 개선은 도시 녹색 공간의 역설을 만들 수 있다.
The creation of new, high-quality green spaces can increase attractiveness, making these neighbourhood more desirable. ## 새로운 양질의 녹색 공간의 조성은 매력을 증가시킬 수 있어 이 지역을 더 탐나게 만든다.
By contrast, the cost of housing can rise, and residents may not be able to afford the rent. ## 대조적으로, 주거비가 오를 수 있고, 거주자들은 임대료를 지불할 여유가 없을지도 모른다.
This results in the exclusion or displacement of the poor neighbourhood’s residents, who were intended to benefit from the ecosystem services provided by the new green space. ## 이는 가난한 지역 거주자들의 배제 혹은 퇴거를 야기하는데, 그들은 새로운 녹색 공간에 의해 제공되는 생태계 서비스로부터 혜택을 얻도록 의도되어 있었다.
In turn, the residents may only be able to afford to live in a similar degraded neighbourhood to the one they left, with low access to green infrastructure. ## 결국, 그 거주자들은 녹색 사회 기반 시설에 접근성이 낮은 채로, 그들이 떠났던 곳과 비슷한 낙후된 지역에나 거주할 형편이 될 수 있을지도 모른다.
`],
["22","해양 생태계",`
An increasing awareness of our effect on the ocean is slowly seeping into the public agenda, dragging behind it a conversation that is decades overdue. ## 해양에 미치는 우리의 영향에 대한 커지는 인식이 공공 안건으로 서서히 스며들면서, 수십 년 동안 미뤄 온 대화를 그것 뒤로 끌고 온다.
But this conversation faces a massive obstacle. ## 하지만 이 대화는 거대한 장애물을 직면한다.
It’s almost impossible to discuss what to do about something changing if you don’t initially know how it works. ## 만약 여러분이 그것이 어떻게 작동하는지를 애초에 알지 못한다면 변화하는 어떤 것에 대해 무엇을 해야 할지를 논의하는 것은 거의 불가능하다.
If a doctor tells a patient that they have a problem with their kidneys, the patient probably already has at least a vague idea about where their kidneys are and what they’re up to. ## 만약 의사가 환자에게 신장에 문제가 있다고 말한다면, 그 환자는 아마도 신장이 어디에 있고 무엇을 하는지에 대해 적어도 막연한 이해는 이미 가지고 있을 것이다.
They learned about that part of their own personal life-support system at school. ## 그들은 학교에서 자기 개인의 생명 유지 체계의 그 부분에 대해 배웠다.
But that’s not the case for the oceans. ## 하지만 해양의 경우는 그렇지 않다.
When we see a news story about the long-term decline in the numbers of krill in the Southern Ocean, it sounds generally like a bad thing. ## 우리가 남극해 크릴 수의 장기적 감소에 대한 신문 기사를 볼 때, 일반적으로 그것은 나쁜 일처럼 들린다.
But there’s far more to it than the risk of whales going hungry. ## 하지만 거기에는 고래가 굶주리는 위험보다 훨씬 더 많은 것이 있다.
Krill are a part of the ocean engine. ## 크릴은 해양 엔진의 일부이다.
We need to understand at least some of the context before we can discuss the change and take appropriate action. ## 우리는 변화에 대해 논의하고 적절한 조치를 취할 수 있기 전에 최소한 어느 정도의 맥락은 이해할 필요가 있다.
`],
["23","로마의 다문화 사회",`
Rome was said to have been a melting pot from the very start. ## 로마는 맨 처음부터 용광로였다고 일컬어졌다.
The historian Livy claimed the city’s original population was comprised of immigrants flooding in from all directions, attracted by Romulus’s deliberate policy of nondiscrimination. ## 역사학자 Livy는 그 도시의 원래 인구가 Romulus의 의도적인 비차별 정책에 의해 이끌려 사방에서 몰려든 이민자들로 구성되었다고 주장했다.
It was this initial openness, Livy asserts, that laid the foundations for the later strength and success of the city. ## Livy가 주장하길, 그 도시의 이후의 힘과 성공을 위한 토대를 놓은 것은 바로 이러한 초기의 개방성이었다.
Romans described their city as multicultural in the generations after its foundation. ## 로마인들은 도시의 설립 이후 여러 세대에 걸쳐 자신들의 도시를 다문화적이라고 묘사했다.
Tradition held that only a minority of the city’s legendary kings were Roman-born, with the others all arriving as immigrants before being chosen for the throne for their virtues and merits. ## 전통적으로, 그 도시의 전설적인 왕들 중 소수만이 로마 태생이었고, 나머지 왕들은 그들의 덕성과 공로로 왕위에 선택되기 전에 모두 이민자로 이주해 왔다고 한다.
As the empire expanded across three continents, Rome eagerly adopted new cultural influences and absorbed incoming groups — perhaps a little too eagerly for some, who, like the poet Juvenal, complained about the rapid rate of cultural change. ## 제국이 세 대륙에 걸쳐 확장되면서, 로마는 적극적으로 새로운 문화적 영향을 채택하였고, 유입되는 집단들을 흡수했다. 이것은 아마도 어떤 사람들에게는 다소 지나치게 적극적이었을지도 모르는데, 그들은 시인 Juvenal처럼 그 급격한 문화 변화 속도에 대해 불평했다.
`],
["24","우주와 생명체",`
The laws and constants of physics and the fundamental forces in our universe have very precise forms and values. ## 물리학 법칙들과 상수들 그리고 우리 우주의 근본 힘들은 매우 정밀한 공식의 형태들과 값들을 가진다.
This means that, if they were only very slightly different, life would not have been possible. ## 이는, 만약 그것들이 아주 약간만 다르다면, 생명체가 가능하지 않았을 것임을 의미한다.
For instance, the precise value of gravity has enabled our universe to arise by permitting the aggregation of dust and gas particles to proto-stars around which planets later came to orbit, including the Earth around the Sun. ## 예를 들어, 중력의 정밀한 값은 태양 주위의 지구를 포함하여 행성들이 나중에 그 주위를 공전하게 되는 원시 항성들로 먼지와 가스 입자들이 응집하는 것을 허용함으로써 우리 우주가 생겨나는 것을 가능하게 했다.
If the value of the electron had been ever so slightly larger or smaller, chemistry, as we know it, would not have been possible and life, which is based on organic chemistry, could not have started. ## 만약 전자의 값이 아주 약간이라도 더 크거나 작았더라면, 우리가 알고 있는 대로의 화학 반응은 가능하지 않았을 것이며 유기 화학 반응에 기반을 둔 생명체는 시작될 수 없었을 것이다.
The universe was not designed for us to evolve, we have no privileged position in the universe; however, the laws and constants of physics allowed advanced life to evolve. ## 우주는 우리가 진화하도록 설계되지 않았고, 우리는 우주에서 어떠한 특권적인 지위를 가지지 않는다. 그러나, 물리학 법칙들과 상수들은 고등 생명체가 진화하는 것을 가능하게 했다.
`],
["29","전통 음식과 건강",`
Human beings have evolved to make the most of the resources available to them in ways that are subtle and complicated. ## 인간은 그들에게 이용 가능한 자원들을 미묘하고 복잡한 방식들로 최대한 이용하도록 진화해 왔다.
When we change our diets, especially when we do so quickly, we are effectively conducting huge experiments in nutrition. ## 우리가 우리의 식단을 바꿀 때, 특히 우리가 매우 빠르게 그렇게 할 때, 우리는 실질적으로 영양 섭취에서 거대한 실험을 시행하고 있는 것이다.
We ought to have more humility. ## 우리는 더 겸손해져야 한다.

const BRK = new Set("in on at of for from with by about as into to over under after before during through between than like without among across around and but or so because although while when where which who whom whose that if whether since until unless though whereas how what why".split(" "));
const PUNC_END = /[,;:—]["”’]?$/;

function chunkify(en){
  const raw = en.split(/\s+/).filter(Boolean);
  const words = [];
  for (const w of raw){
    if ((w === '—' || w === '...') && words.length) words[words.length-1] += ' ' + w;
    else words.push(w);
  }
  const groups = []; let cur = [];
  for (const w of words){
    const k = w.toLowerCase().replace(/[^a-z]/g,'');
    if (cur.length && BRK.has(k)){ groups.push(cur); cur = []; }
    cur.push(w);
    if (PUNC_END.test(w)){ groups.push(cur); cur = []; }
  }
  if (cur.length) groups.push(cur);
  const out = [];
  for (let g = 0; g < groups.length; g++){
    const c = groups[g];
    if (c.length === 1 && !PUNC_END.test(c[0]) && g < groups.length - 1){
      groups[g+1] = c.concat(groups[g+1]); continue;
    }
    out.push(c);
  }
  if (out.length > 1 && out[out.length-1].length === 1 && out[out.length-2].length < 4){
    const l = out.pop(); out[out.length-1] = out[out.length-1].concat(l);
  }
  const fin = [];
  for (const c of out){
    if (c.length <= 4){ fin.push(c.join(' ')); continue; }
    const parts = Math.ceil(c.length / 3), size = Math.ceil(c.length / parts);
    for (let i = 0; i < c.length; i += size) fin.push(c.slice(i, i + size).join(' '));
  }
  if (fin.length < 2) return words.length > 1 ? words : fin;
  return fin;
}

function parseRaw(raw){
  const res = [];
  for (const line of raw.split('\n')){
    const t = line.trim(); if (!t) continue;
    const m = t.match(/^(?:\[([^\]]+)\]\s*)?(.+?)\s*##\s*(.+)$/);
    if (!m) continue;
    const en = m[2].trim();
    const chunks = chunkify(en);
    if (chunks.length < 2) continue;
    res.push({spk: m[1] || '', en, ko: m[3].trim(), chunks});
  }
  return res;
}

function shuffle(a){
  const n = a.length; let b;
  for (let tries = 0; tries < 12; tries++){
    b = a.slice();
    for (let i = n - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    if (n < 2 || b.some((v, i) => v !== a[i])) break;
  }
  return b;
}

const app = document.getElementById('app');
let stack = [{v:'home'}];
let S = [];

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function go(v){ stack.push(v); render(); }
function back(){ if (stack.length > 1){ stack.pop(); render(); } }
function home(){ stack = [{v:'home'}]; render(); }

function bar(title){
  return `<div class="bar"><button onclick="home()">홈</button><button onclick="back()">이전</button><span class="t">${esc(title||'')}</span></div>`;
}

function render(){
  const cur = stack[stack.length - 1];
  window.scrollTo(0, 0);
  if (cur.v === 'home'){
    app.innerHTML = `<div class="home"><h1>단어 배열 연습</h1>
      <button class="big" onclick="go({v:'list',exam:'모고25'})">모고25</button>
      <button class="big" onclick="go({v:'list',exam:'모고26'})">모고26</button>
      <button class="big" onclick="openLesson('3과본문')">3과본문</button>
      <button class="big" onclick="openLesson('4과본문')">4과본문</button></div>`;
  } else if (cur.v === 'list'){
    const items = EXAMS[cur.exam];
    app.innerHTML = bar(cur.exam) + `<div class="list">` + items.map((it, i) =>
      `<button class="row" onclick="openItem('${cur.exam}',${i})"><span class="n">${it[0]}</span><span>${esc(it[1])}</span></button>`).join('') + `</div>`;
  } else if (cur.v === 'practice'){
    S = parseRaw(cur.raw).map(s => ({...s, order: shuffle(s.chunks.map((_, i) => i)), slots: new Array(s.chunks.length).fill(null), graded: false}));
    app.innerHTML = bar(cur.title) + S.map((_, i) => cardHTML(i)).join('');
  }
}
function openItem(exam, i){ const it = EXAMS[exam][i]; go({v:'practice', title: `${exam} · ${it[0]}번 ${it[1]}`, raw: it[2]}); }
function openLesson(name){ go({v:'practice', title: name, raw: LESSONS[name]}); }

function cardHTML(i){
  const s = S[i], n = s.chunks.length;
  const bank = s.order.filter(id => !s.slots.includes(id));
  let slots = '';
  for (let k = 0; k < n; k++){
    const id = s.slots[k];
    if (id === null){
      slots += `<span class="slot${s.graded ? ' empty-bad' : ''}" data-k="${k}"></span>`;
    } else {
      let cls = '';
      if (s.graded) cls = s.chunks[id] === s.chunks[k] ? ' ok' : ' bad';
      slots += `<span class="slot filled" data-k="${k}"><span class="chip${cls}" data-id="${id}" data-src="s">${esc(s.chunks[id])}</span></span>`;
    }
  }
  const bankHTML = bank.map(id => `<span class="chip" data-id="${id}" data-src="b">${esc(s.chunks[id])}</span>`).join('');
  let res = '';
  if (s.graded){
    const okAll = s.slots.every((id, k) => id !== null && s.chunks[id] === s.chunks[k]);
    res = `<div class="res"><b class="${okAll ? 'ok' : 'bad'}">${okAll ? '정답' : '오답'}</b><div class="ans">${esc(s.en)}</div></div>`;
  }
  return `<div class="card${s.graded ? ' locked' : ''}" id="c${i}" data-i="${i}">
    <div class="head"><span class="num">${i + 1}</span>${s.spk ? `<span class="spk">${esc(s.spk)}</span>` : ''}</div>
    <div class="ko">${esc(s.ko)}</div>
    <div class="slots">${slots}</div>
    <div class="bank">${bankHTML}</div>
    <div class="act"><button onclick="grade(${i})">채점</button><button onclick="resetCard(${i})">초기화</button></div>
    ${res}</div>`;
}
function drawCard(i){ document.getElementById('c' + i).outerHTML = cardHTML(i); }
function grade(i){ S[i].graded = true; drawCard(i); }
function resetCard(i){ const s = S[i]; s.slots.fill(null); s.graded = false; s.order = shuffle(s.chunks.map((_, k) => k)); drawCard(i); }

function place(i, id, k){
  const s = S[i], cur = s.slots.indexOf(id);
  if (k < 0){ if (cur >= 0) s.slots[cur] = null; }
  else {
    const other = s.slots[k];
    if (cur >= 0) s.slots[cur] = other;
    s.slots[k] = id;
  }
  drawCard(i);
}
function firstEmpty(i){ return S[i].slots.indexOf(null); }

let drag = null;
app.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const card = chip.closest('.card'); if (!card) return;
  const i = +card.dataset.i;
  if (S[i].graded) return;
  e.preventDefault();
  drag = {chip, i, id: +chip.dataset.id, src: chip.dataset.src, sx: e.clientX, sy: e.clientY, moved: false, ghost: null, pid: e.pointerId};
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6){
    drag.moved = true;
    const g = drag.chip.cloneNode(true);
    g.className = 'chip ghost'; document.body.appendChild(g);
    drag.ghost = g; drag.chip.classList.add('lift');
  }
  if (drag.ghost){ drag.ghost.style.left = e.clientX + 'px'; drag.ghost.style.top = e.clientY + 'px'; }
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  if (cancel){ d.chip.classList.remove('lift'); return; }
  if (!d.moved){
    if (d.src === 'b'){ const k = firstEmpty(d.i); if (k >= 0) place(d.i, d.id, k); }
    else place(d.i, d.id, -1);
    return;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const card = document.getElementById('c' + d.i);
  let target = null;
  if (el && card && card.contains(el)){
    const slot = el.closest('.slot');
    if (slot) target = +slot.dataset.k;
    else if (el.closest('.slots')){ const k = firstEmpty(d.i); target = k >= 0 ? k : null; }
    else if (el.closest('.bank') && d.src === 's') target = -1;
  }
  if (target === null) d.chip.classList.remove('lift');
  else place(d.i, d.id, target);
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));

render();
</script>
